<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Max Goodstein</title>
  <meta name="description" content="Landscape architecture portfolio of Max Goodstein, RLA, NYC Parks Capital Projects">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent: #2d6a4f;
      --accent-hover: #40916c;
      --bg: #fafafa;
      --text: #1a1a1a;
      --text-secondary: #555555;
      --border: #e0e0e0;
      --card-bg: #ffffff;
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    header { margin-bottom: 2.5rem; }
    .back { display: inline-block; font-size: 0.85rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 1.5rem; }
    .back:hover { color: var(--accent); }
    h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .subtitle { font-size: 1rem; color: var(--text-secondary); line-height: 1.6; max-width: 620px; }

    html { scroll-behavior: smooth; }

    /* Sticky jump nav */
    .nav { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -1.25rem 1.5rem; padding: 0.6rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; gap: 0.4rem; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { flex: 0 0 auto; font-size: 0.78rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; padding: 0.35rem 0.75rem; border: 1px solid var(--border); border-radius: 999px; background: var(--card-bg); white-space: nowrap; }
    .nav a:hover { border-color: var(--accent); color: var(--accent); }
    .nav a.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .projects { display: flex; flex-direction: column; gap: 2rem; }
    .project { scroll-margin-top: 4rem; }
    .project { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .project .hero { display: block; width: 100%; cursor: zoom-in; background: #eee; border: 0; padding: 0; }
    .project .hero img { display: block; width: 100%; height: auto; max-height: 600px; object-fit: cover; }
    .project .body { padding: 1.2rem 1.4rem 1.4rem; }
    .project h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.3rem; }
    .project .meta { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.7rem; }
    .project p { font-size: 0.92rem; line-height: 1.65; color: var(--text-secondary); }

    .thumbs { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0 1.4rem 1.3rem; -webkit-overflow-scrolling: touch; }
    .thumbs button { flex: 0 0 auto; width: 88px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; padding: 0; background: #fff; cursor: pointer; }
    .thumbs button:hover { border-color: var(--accent); }
    .thumbs img { display: block; width: 100%; height: 62px; object-fit: cover; }

    /* Lightbox */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; z-index: 10; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 82vh; border-radius: 4px; background: #fff; }
    .lb-caption { color: #ccc; font-size: 0.85rem; margin-top: 0.75rem; text-align: center; }
    .lb-btn { position: fixed; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.12); color: #fff; border: 0; font-size: 1.6rem; line-height: 1; padding: 0.7rem 0.9rem; border-radius: 8px; cursor: pointer; }
    .lb-btn:hover { background: rgba(255,255,255,0.25); }
    #lbPrev { left: 0.75rem; }
    #lbNext { right: 0.75rem; }
    #lbClose { position: fixed; top: 0.75rem; right: 0.75rem; transform: none; font-size: 1.1rem; }

    .divider { width: 40px; height: 1px; background: var(--border); margin: 3rem auto 1.5rem; }
    .footer { font-size: 0.8rem; color: var(--text-secondary); opacity: 0.6; text-align: center; }
    @media (max-width: 480px) { .project .body { padding: 1rem 1.1rem 1.1rem; } .thumbs { padding: 0 1.1rem 1.1rem; } }

    /* Before/after compare slider */
    .compare { position: relative; width: 100%; aspect-ratio: 3 / 2; max-height: 600px; overflow: hidden; background: #eee; touch-action: none; }
    .compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .compare .over { clip-path: inset(0 calc(100% - var(--pos, 50%)) 0 0); }
    .compare input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; -webkit-appearance: none; }
    .cmp-handle { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,0.5); pointer-events: none; }
    .cmp-handle::after { content: "\2194"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #333; font-size: 1rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 6px rgba(0,0,0,0.4); }
    .cmp-label { position: absolute; top: 0.7rem; padding: 0.25rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 500; background: rgba(0,0,0,0.55); color: #fff; pointer-events: none; }
    .cmp-label.before { left: 0.7rem; }
    .cmp-label.after { right: 0.7rem; }

    /* Edit mode */
    body.editing { padding-bottom: 5.5rem; }
    body.editing [contenteditable] { outline: 1px dashed var(--accent-hover); outline-offset: 3px; border-radius: 2px; }
    body.editing [contenteditable]:focus { outline: 2px solid var(--accent); background: #f2f8f5; }
    .editbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #1f2d27; color: #e8efeb; padding: 0.7rem 1rem; }
    body.editing .editbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
    .editbar .msg { font-size: 0.78rem; color: #b9cbc2; flex: 1 1 220px; line-height: 1.4; }
    .editbar button { border: 0; border-radius: 8px; padding: 0.55rem 0.9rem; font-size: 0.82rem; font-weight: 500; cursor: pointer; background: rgba(255,255,255,0.12); color: #fff; }
    .editbar button:hover { background: rgba(255,255,255,0.22); }
    .editbar button.primary { background: var(--accent); }
    .editbar button.primary:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" href="/">&larr; maxgoodstein.com</a>
      <h1>Portfolio</h1>
      <p class="subtitle">Selected park projects: design, construction documents, and project management. Max Goodstein, RLA.</p>
    </header>

    <nav class="nav" id="nav" aria-label="Jump to project"></nav>

    <div class="projects" id="projects"></div>

    <div class="divider"></div>
    <p class="footer">&copy; 2026 Max Goodstein</p>
  </div>

  <div class="editbar" id="editbar">
    <span class="msg" id="editMsg">Edit mode: click any text above to change it. Changes are saved as a draft on this device; download the file to publish.</span>
    <button class="primary" id="edDownload">Download projects.js</button>
    <button id="edCopy">Copy</button>
    <button id="edReset">Discard draft</button>
    <button id="edDone">Done</button>
  </div>

  <div class="lightbox" id="lightbox">
    <img id="lbImg" alt="">
    <div class="lb-caption" id="lbCap"></div>
    <button class="lb-btn" id="lbPrev" aria-label="Previous">&larr;</button>
    <button class="lb-btn" id="lbNext" aria-label="Next">&rarr;</button>
    <button class="lb-btn" id="lbClose" aria-label="Close">&times;</button>
  </div>

  <script src="projects.js"></script>
  <script>
    // Numbers map to img/pNN.webp (portfolio PDF pages); strings map to img/<name>.webp
    const src = n => typeof n === "number" ? `img/p${String(n).padStart(2, "0")}.webp` : `img/${n}.webp`;

    // Edit mode: open the page with ?edit added to the URL.
    const EDIT = new URLSearchParams(location.search).has("edit");
    const DRAFT_KEY = "portfolioDraft";
    if (EDIT) {
      document.body.classList.add("editing");
      const draft = localStorage.getItem(DRAFT_KEY);
      if (draft) {
        try {
          const saved = JSON.parse(draft);
          if (saved.length !== PROJECTS.length) throw new Error("draft is from an older project list");
          saved.forEach((s, i) => {
            if (!PROJECTS[i]) return;
            PROJECTS[i].title = s.title; PROJECTS[i].meta = s.meta; PROJECTS[i].desc = s.desc;
            if (s.pages) s.pages.forEach((pg, j) => { if (PROJECTS[i].pages[j]) PROJECTS[i].pages[j][1] = pg[1]; });
          });
        } catch (e) { console.warn("Bad draft, ignoring", e); }
      }
    }
    const saveDraft = () => localStorage.setItem(DRAFT_KEY, JSON.stringify(PROJECTS));

    // Jump nav
    const nav = document.getElementById("nav");
    const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    PROJECTS.forEach(proj => {
      const a = document.createElement("a");
      a.href = "#" + slug(proj.title);
      a.textContent = proj.short || proj.title;
      nav.appendChild(a);
    });

    const container = document.getElementById("projects");
    PROJECTS.forEach((proj, pi) => {
      const art = document.createElement("article");
      art.className = "project";
      art.id = slug(proj.title);
      const heroIdx = proj.pages.findIndex(p => p[0] === proj.hero);
      const heroHTML = proj.compare
        ? `<div class="compare" style="--pos:50%">
             <img loading="lazy" src="${src(proj.compare[1])}" alt="${proj.title}, after">
             <img class="over" loading="lazy" src="${src(proj.compare[0])}" alt="${proj.title}, before">
             <span class="cmp-label before">Before</span>
             <span class="cmp-label after">After</span>
             <input type="range" min="0" max="100" value="50" step="0.1" aria-label="Before and after comparison">
             <div class="cmp-handle"></div>
           </div>`
        : `<button class="hero" aria-label="Open gallery"><img loading="lazy" src="${src(proj.hero)}" alt="${proj.title}"></button>`;
      art.innerHTML = `
        ${heroHTML}
        <div class="body">
          <h2>${proj.title}</h2>
          <div class="meta">${proj.meta}</div>
          <p>${proj.desc}</p>
        </div>
        <div class="thumbs"></div>`;
      const heroBtn = art.querySelector(".hero");
      if (heroBtn) heroBtn.addEventListener("click", () => openLB(pi, heroIdx));
      const cmp = art.querySelector(".compare");
      if (cmp) cmp.querySelector("input").addEventListener("input", e => {
        cmp.style.setProperty("--pos", e.target.value + "%");
      });
      if (EDIT) {
        [["h2", "title"], [".meta", "meta"], ["p", "desc"]].forEach(([sel, field]) => {
          const el = art.querySelector(sel);
          try { el.contentEditable = "plaintext-only"; } catch { el.contentEditable = "true"; }
          el.addEventListener("input", () => { PROJECTS[pi][field] = el.textContent; saveDraft(); });
        });
      }
      const thumbs = art.querySelector(".thumbs");
      proj.pages.forEach((pg, idx) => {
        const b = document.createElement("button");
        b.innerHTML = `<img loading="lazy" src="${src(pg[0])}" alt="${pg[1]}">`;
        b.title = pg[1];
        b.addEventListener("click", () => openLB(pi, idx));
        thumbs.appendChild(b);
      });
      container.appendChild(art);
    });

    // Lightbox
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbCap = document.getElementById("lbCap");
    let cur = { p: 0, i: 0 };
    function openLB(p, i) { cur = { p, i }; render(); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
    function closeLB() { lb.classList.remove("open"); document.body.style.overflow = ""; }
    function render() {
      const proj = PROJECTS[cur.p];
      const [n, cap] = proj.pages[cur.i];
      lbImg.src = src(n);
      lbCap.textContent = EDIT ? cap : `${proj.title}: ${cap} (${cur.i + 1}/${proj.pages.length})`;
    }
    function step(d) {
      const len = PROJECTS[cur.p].pages.length;
      cur.i = (cur.i + d + len) % len;
      render();
    }
    document.getElementById("lbPrev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
    document.getElementById("lbNext").addEventListener("click", e => { e.stopPropagation(); step(1); });
    document.getElementById("lbClose").addEventListener("click", closeLB);
    lb.addEventListener("click", e => { if (e.target === lb) closeLB(); });
    document.addEventListener("keydown", e => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") closeLB();
      if (e.target.isContentEditable) return;
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });

    // Highlight the nav chip for the project currently in view
    const chips = [...nav.querySelectorAll("a")];
    const cards = [...container.querySelectorAll(".project")];
    const setActive = id => {
      chips.forEach(c => {
        const on = c.getAttribute("href") === "#" + id;
        c.classList.toggle("active", on);
        if (on) c.scrollIntoView({ block: "nearest", inline: "nearest" });
      });
    };
    const io = new IntersectionObserver(entries => {
      const vis = entries.filter(e => e.isIntersecting)
        .sort((x, y) => x.boundingClientRect.top - y.boundingClientRect.top);
      if (vis.length) setActive(vis[0].target.id);
    }, { rootMargin: "-10% 0px -60% 0px" });
    cards.forEach(c => io.observe(c));

    // Edit mode toolbar
    if (EDIT) {
      try { lbCap.contentEditable = "plaintext-only"; } catch { lbCap.contentEditable = "true"; }
      lbCap.addEventListener("input", () => {
        PROJECTS[cur.p].pages[cur.i][1] = lbCap.textContent;
        saveDraft();
      });

      const msg = document.getElementById("editMsg");
      const header = "// Portfolio content: edit this file directly, or use maxgoodstein.com/portfolio/?edit\n" +
        "// and download the result. To publish: replace portfolio/projects.js with this file,\n" +
        "// then commit and push.\n\n";
      const exportText = () => header + "const PROJECTS = " + JSON.stringify(PROJECTS, null, 2) + ";\n";

      document.getElementById("edDownload").addEventListener("click", () => {
        const blob = new Blob([exportText()], { type: "text/javascript" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "projects.js";
        a.click();
        URL.revokeObjectURL(a.href);
        msg.textContent = "Downloaded. Replace portfolio/projects.js in the repo with it, then commit & push.";
      });
      document.getElementById("edCopy").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(exportText());
          msg.textContent = "Copied projects.js to clipboard.";
        } catch { msg.textContent = "Copy failed, use Download instead."; }
      });
      document.getElementById("edReset").addEventListener("click", () => {
        if (!confirm("Discard your draft edits and reload the published text?")) return;
        localStorage.removeItem(DRAFT_KEY);
        location.reload();
      });
      document.getElementById("edDone").addEventListener("click", () => { location.href = location.pathname; });
    }
  </script>
</body>
</html>
